[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atrium-litellm-controller"
version = "0.1.0"
description = "Protected owned-object reconciliation for the isolated Atrium LiteLLM adapter"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
atrium-litellm-controller = "atrium_litellm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["atrium_litellm"]
