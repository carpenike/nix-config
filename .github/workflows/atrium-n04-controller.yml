---
name: Atrium N04 controller

"on":
  pull_request:
    paths:
      - pkgs/atrium-litellm-controller/**
      - tests/atrium_n04/**
      - .github/workflows/atrium-n04-controller.yml
      - pkgs/default.nix
      - flake.nix
      - flake.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    name: N04 package and readback regressions (not native convergence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.NIX_FLAKE_INPUTS_PAT }}
      - name: Build the controller and existing isolated unit checks
        run: |
          nix build --builders '' --no-link --no-write-lock-file \
            .#packages.x86_64-linux.atrium-litellm-controller \
            .#checks.x86_64-linux.atrium-n04-units
