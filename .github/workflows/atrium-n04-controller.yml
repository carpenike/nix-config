---
name: Atrium controller deployment

"on":
  pull_request:
    paths:
      - hosts/forge/default.nix
      - hosts/forge/services/atrium.nix
      - hosts/forge/services/atrium-pwa.nix
      - hosts/forge/services/hermes-agent.nix
      - hosts/forge/services/homelab-mcp.nix
      - hosts/forge/services/litellm.nix
      - hosts/forge/atrium/identity.nix
      - hosts/forge/atrium/registry.nix
      - hosts/forge/atrium/bootstrap.nix
      - hosts/forge/atrium/runtime.nix
      - hosts/forge/atrium/identity-bootstrap.json
      - hosts/forge/atrium/pocketid-authority.json
      - hosts/forge/atrium/litellm-controller-isolated.nix
      - tests/atrium_n03/forge-evaluate.nix
      - tests/atrium_n03/native-policy-compatibility.nix
      - tests/atrium_n03/native-vendor-compatibility.json
      - tests/atrium_n03/client-views.nix
      - tests/atrium_n03/hermes-transition.nix
      - tests/atrium_n03/identity-bootstrap.nix
      - tests/atrium_n03/pins.json
      - tests/atrium_n03/pwa.nix
      - tests/atrium_n03/pre-adoption.nix
      - tests/atrium_n04/*.nix
      - tests/atrium/*.nix
      - .github/workflows/atrium-n04-controller.yml
      - pkgs/default.nix
      - flake.nix
      - flake.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-hosting:
    name: P06 browser hosting and native route consumption
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.NIX_FLAKE_INPUTS_PAT }}
      - name: Check browser configuration and composed Caddy boundaries
        run: |
          nix build --builders '' --no-link --no-write-lock-file \
            --option allow-import-from-derivation false \
            .#checks.x86_64-linux.atrium-pwa-wiring \
            .#checks.x86_64-linux.atrium-forge-caddy \
            .#checks.x86_64-linux.atrium-forge-adopted-caddy \
            .#checks.x86_64-linux.atrium-forge-c10-settings
  controller:
    name: N03 Forge preparation and N04 package consumption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.NIX_FLAKE_INPUTS_PAT }}
      - name: Check the app CLI, Forge preparation and isolated wiring
        run: |
          nix build --builders '' --no-link --no-write-lock-file \
            --option allow-import-from-derivation false \
            .#checks.x86_64-linux.atrium-identity-bootstrap \
            .#checks.x86_64-linux.atrium-forge-preparation \
            .#checks.x86_64-linux.atrium-forge-native-policy-compatibility \
            .#checks.x86_64-linux.atrium-forge-client-views \
            .#checks.x86_64-linux.atrium-hermes-config-transition \
            .#checks.x86_64-linux.atrium-n04-package-smoke \
            .#checks.x86_64-linux.atrium-n04-units
