---
name: Atrium egress deployment

"on":
  pull_request:
    paths:
      - tests/atrium_n06/*.nix
      - tests/atrium_n04/fixture.nix
      - tests/atrium/*.nix
      - .github/workflows/atrium-n06-fixtures.yml
      - flake.nix
      - flake.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixture-contracts:
    name: N06 isolated namespace deployment (not native egress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.NIX_FLAKE_INPUTS_PAT }}
      - name: Validate namespace and service composition without activation
        run: |
          nix build --builders '' --no-link --no-write-lock-file \
            .#checks.x86_64-linux.atrium-n06-units
